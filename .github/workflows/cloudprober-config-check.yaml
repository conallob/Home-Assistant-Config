name: Cloudprober Configuration Check

# Validates cloudprober/base.cfg (and, via its `include` directives, every
# file it pulls in) with `cloudprober --configtest`.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'cloudprober/**'
      - '.github/workflows/cloudprober-config-check.yaml'

jobs:
  validate:
    name: Cloudprober Configuration Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate cloudprober/base.cfg
        run: |
          # Mount the whole directory so `include "internet_probeset.cfg"`
          # resolves next to base.cfg.
          docker run --rm \
            -v "$PWD/cloudprober:/etc/cloudprober:ro" \
            cloudprober/cloudprober:latest \
            --configtest --config_file=/etc/cloudprober/base.cfg

      - name: Validate gaming_targets.textpb
        run: |
          # --configtest parses the config but never reads a targets file, so a
          # typo in gaming_targets.textpb would pass it and silently probe
          # nothing. Start cloudprober briefly and check it loads every
          # resource. The main config here is a stub (the real one pulls in
          # things only the deployment has); {{ configDir }} then resolves to
          # this temp dir, which holds just the probeset and its targets.
          d=$(mktemp -d)
          cp cloudprober/gaming_probeset.cfg cloudprober/gaming_targets.textpb "$d"/
          echo 'include "gaming_probeset.cfg"' > "$d/main.cfg"
          chmod -R a+rX "$d"
          want=$(grep -c '^resource {' "$d/gaming_targets.textpb")
          timeout 15 docker run --rm -v "$d:/cfg:ro" cloudprober/cloudprober:latest \
            --config_file=/cfg/main.cfg > "$d.log" 2>&1 || true
          cat "$d.log"
          grep -q "Read $want endpoints" "$d.log"
