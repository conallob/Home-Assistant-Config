name: Deploy Config

on:
  push:
    branches:
      - main

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      esphome: ${{ steps.check.outputs.esphome }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for ESPHome-relevant changes
        id: check
        run: |
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -qE '^(esphome/|\.github/workflows/esphome-config-check\.yaml)'; then
            echo "esphome=true" >> "$GITHUB_OUTPUT"
          else
            echo "esphome=false" >> "$GITHUB_OUTPUT"
          fi

  # Both checks run as job-level dependencies (not via workflow_run) so
  # deploy_config's `needs:` gives a real completion guarantee instead of
  # racing whichever workflow_run event happens to arrive first.
  home_assistant_check:
    name: Home Assistant Configuration Check
    needs: changes
    uses: ./.github/workflows/home-assistant-config-check.yaml

  esphome_check:
    name: ESPHome Configuration Check
    needs: changes
    if: needs.changes.outputs.esphome == 'true'
    uses: ./.github/workflows/esphome-config-check.yaml

  deploy_config:
    name: Deploy to Home Assistant
    runs-on: ubuntu-latest
    needs:
      - home_assistant_check
      - esphome_check
    if: |
      always() &&
      needs.home_assistant_check.result == 'success' &&
      (needs.esphome_check.result == 'success' || needs.esphome_check.result == 'skipped')
    steps:
      - name: Deploy to Home Assistant
        uses: joelwmale/webhook-action@2.1.0
        with:
          url: ${{ secrets.HOME_ASSISTANT_WEBHOOK_URL }}
          body: '{}'
