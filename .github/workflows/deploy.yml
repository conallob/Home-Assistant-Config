name: Deploy Config

on:
  push:
    branches:
      - main

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      esphome: ${{ steps.check.outputs.esphome }}
      categories: ${{ steps.categories.outputs.categories }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for ESPHome-relevant changes
        id: check
        run: |
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -qE '^(esphome/|\.github/workflows/esphome-config-check\.yaml)'; then
            echo "esphome=true" >> "$GITHUB_OUTPUT"
          else
            echo "esphome=false" >> "$GITHUB_OUTPUT"
          fi

      # Map changed paths to the config categories the Home Assistant deploy
      # webhook knows how to reload (see automation/git_pull_config.yaml).
      # "restart" = change that can't be hot-reloaded; HA notifies the phone.
      # If the diff can't be computed (e.g. first push), reload everything.
      - name: Work out which config categories changed
        id: categories
        run: |
          if ! files=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}"); then
            echo 'categories=["all"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cats=()
          add() { local c; for c in "${cats[@]}"; do [ "$c" = "$1" ] && return; done; cats+=("$1"); }
          while IFS= read -r f; do
            case "$f" in
              automation/*|automations.yaml|blueprints/*) add automation ;;&
              blueprints/*|script/*|scripts.yaml) add script ;;
              scenes.yaml) add scene ;;
              template/*) add template ;;
              rest/*) add rest ;;
              rest_command/*) add rest_command ;;
              input_select/*) add input_select ;;
              input_number/*) add input_number ;;
              input_datetime/*) add input_datetime ;;
              timer/*) add timer ;;
              themes/*) add themes ;;
              configuration.yaml|sensor/*|binary_sensor/*|groups.yaml|media_player.yaml|custom_components/*) add restart ;;
            esac
          done <<< "$files"
          echo "categories=$(jq -nc '$ARGS.positional' --args "${cats[@]}")" >> "$GITHUB_OUTPUT"

  # Both checks run as job-level dependencies (not via workflow_run) so
  # deploy_config's `needs:` gives a real completion guarantee instead of
  # racing whichever workflow_run event happens to arrive first.
  home_assistant_check:
    name: Home Assistant Configuration Check
    needs: changes
    uses: ./.github/workflows/home-assistant-config-check.yaml

  esphome_check:
    name: ESPHome Configuration Check
    needs: changes
    if: needs.changes.outputs.esphome == 'true'
    uses: ./.github/workflows/esphome-config-check.yaml

  deploy_config:
    name: Deploy to Home Assistant
    runs-on: ubuntu-latest
    needs:
      - changes
      - home_assistant_check
      - esphome_check
    if: |
      always() &&
      needs.home_assistant_check.result == 'success' &&
      (needs.esphome_check.result == 'success' || needs.esphome_check.result == 'skipped')
    steps:
      - name: Deploy to Home Assistant
        uses: joelwmale/webhook-action@2.1.0
        with:
          url: ${{ secrets.HOME_ASSISTANT_WEBHOOK_URL }}
          headers: '{"Content-Type": "application/json"}'
          body: '{"categories": ${{ needs.changes.outputs.categories }}}'
