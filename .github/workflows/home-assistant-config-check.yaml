name: Home Assistant Configuration Check

on:
  pull_request:
    branches:
      - main
  # Also callable as a job dependency from deploy.yml, so deploy can wait
  # on this check's actual completion instead of racing it via workflow_run.
  workflow_call:

jobs:
  validate:
    name: Home Assistant Core Configuration Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Home Assistant Configuration Check
        uses: frenck/action-home-assistant@v1
        with:
          secrets: fakesecrets.yaml
