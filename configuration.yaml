# Configure a default setup of Home Assistant (frontend, api, etc)
default_config:

# Input Booleans for manual toggles
input_boolean:
  taku_sleep_mode:
    name: "Taku Sleep Mode"
    icon: mdi:sleep

# Input Numbers — tracked machine settings, one file per feature under input_number/
input_number: !include_dir_merge_named input_number

# Input Datetimes — adjustable schedule windows, one file per feature under input_datetime/
input_datetime: !include_dir_merge_named input_datetime

frontend:
  themes: !include_dir_merge_named themes

# Git pull integration
shell_command:
  git_pull_config: git config --global --add safe.directory /config && cd /config && git pull

# Text to speech
tts:
  - platform: google_translate

group: !include groups.yaml

# GUI Maintained Automations
automation ui: !include automations.yaml

# Config Maintained Automations
automation manual: !include_dir_list /config/automation

script: !include_dir_named /config/script
scene: !include scenes.yaml
template: !include_dir_list /config/template

sensor: !include_dir_list /config/sensor

rest: !include_dir_list /config/rest
rest_command: !include_dir_named /config/rest_command

media_player: !include media_player.yaml

prometheus:

# https://www.home-assistant.io/integrations/recorder/
recorder:

binary_sensor: !include_dir_list /config/binary_sensor

# Logging per integration controls
logger:
  default: warning

mqtt:

# Utility Meter for Electricity Meter
utility_meter:
  daily_electricity_energy:
    source: sensor.grid_em_channel_1_energy
    name: Daily Electricity Meter Energy
    cycle: daily
    tariffs:
      - day
      - peak
      - night
  monthly_electricity_energy:
    source: sensor.grid_em_channel_1_energy
    name: Monthly Electricity Meter Energy
    cycle: monthly
    tariffs:
      - day
      - peak
      - night
  current_electricity_tariff:
    source: sensor.grid_em_channel_1_energy
    name: Current Electricity Tariff
    cycle: daily
    tariffs:
      - day
      - peak
      - night
  daily_gas_energy:
    source: sensor.gas_meter_volume
    name: Daily Gas Meter Volume
    cycle: daily
  monthly_gas_energy:
    source: sensor.gas_meter_volume
    name: Monthly Gas Meter Volume
    cycle: monthly

powercalc:
  enable_analytics: true
  utility_meter_tariffs:
    - day
    - peak
    - night
#
# HACS Integration Configs
#

notify:
  - name: "conall_phone"
    platform: group
    services:
      - service: mobile_app_conall_s_iphone_17_pro
  - name: "Omnifocus"
    platform: smtp
    sender: "home-assistant@taku.ie"
    recipient: "conall.asmzn@sync.omnigroup.com"


# dLight, using custom component code
#light:
#  - platform: dlight
#    host: 192.168.0.204
#    device_id: QzvVfdhT

keyboard_remote:
  # Green 8BitDo Micro - update device_descriptor path after pairing
  # Run: ls -la /dev/input/by-id/ to find the stable symlink
  - device_descriptor: '/dev/input/by-id/bluetooth-8BitDo_Micro_gamepad-event-kbd'
    type:
      - 'key_up'
      - 'key_down'
      - 'key_hold'
