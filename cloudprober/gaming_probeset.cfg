# Probeset: gaming cloud reachability (Nintendo, Fortnite/Epic, Minecraft).
# A workload for hosts at taku.ie only, so it runs on the homelab cluster and
# here (Woodlands), and deliberately not at Meadow Close. Identical in
# homelab-apps (apps/cloudprober/config/) and Home-Assistant-Config
# (cloudprober/), alongside gaming_targets.textpb; keep them in step. Probing
# the same targets from both tells a site-local problem (one fails) from a
# service outage (both fail) or an ISP/DNS problem.
#
# Cloudprober has no first-class "probeset" object; a probe with multiple
# targets is the idiomatic equivalent, and yields one series per target. This
# is a single probe, `gaming`: what varies per target (which game it belongs
# to, plain HTTP vs HTTPS, port) lives with the target in gaming_targets.textpb
# and reaches the metrics as the `game` label, so adding or moving a target
# never touches this file.
#
# Success means "got an HTTP response" (DNS, TCP and TLS all worked): there is
# deliberately no status-code validator, because several targets are API or CDN
# hosts that answer 401/403/404 at "/". Add an http_validator if some should be
# held to 2xx.

probe {
  name: "gaming"
  type: HTTP
  targets {
    file_targets {
      # configDir is the directory of this config file's *main* config, which
      # is where the targets file sits.
      file_path: "{{ configDir }}/gaming_targets.textpb"
      format: TEXTPB
      re_eval_sec: 300
    }
  }
  # No scheme or port here: both come from each target (the __cp_scheme__
  # label and port in the targets file), since the Switch's connection-test
  # hosts are plain HTTP on 80 and everything else is HTTPS.
  http_probe {}
  additional_label {
    key: "game"
    value: "@target.label.game@"
  }
  interval_msec: 60000
  timeout_msec: 10000
}
