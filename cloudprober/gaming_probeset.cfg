# Probeset: gaming cloud reachability (Nintendo, Fortnite/Epic, Minecraft).
# Identical in homelab-apps (apps/cloudprober/config/) and Home-Assistant-Config
# (cloudprober/); keep the two in step. Having both sites probe the same
# targets tells a lab-side problem (this site only) from a service outage
# (both sites fail) or a local ISP/DNS problem.
#
# Cloudprober has no first-class "probeset" object; a probe with multiple
# targets is the idiomatic equivalent, and yields one series per target. One
# probe per game, each tagged with a `game` label so dashboards and alerts can
# select on it.
#
# Success means "got an HTTP response" (DNS, TCP and TLS all worked): there is
# deliberately no status-code validator, because several of these are API or
# CDN hosts that answer 401/403/404 at "/". Add an http_validator to a probe if
# one of its targets should be held to 2xx.

probe {
  name: "gaming_nintendo"
  type: HTTP
  targets {
    host_names: "www.nintendo.com,accounts.nintendo.com"
  }
  http_probe {
    protocol: HTTPS
    port: 443
  }
  additional_label {
    key: "game"
    value: "nintendo"
  }
  interval_msec: 60000
  timeout_msec: 10000
}

# The Switch's own "test connection" endpoints. Plain HTTP on purpose: that is
# what the console uses, and ctest answers 200 with an `X-Organization:
# Nintendo` header.
probe {
  name: "gaming_nintendo_conntest"
  type: HTTP
  targets {
    host_names: "conntest.nintendowifi.net,ctest.cdn.nintendo.net"
  }
  http_probe {
    protocol: HTTP
    port: 80
  }
  additional_label {
    key: "game"
    value: "nintendo"
  }
  interval_msec: 60000
  timeout_msec: 10000
}

# Fortnite runs on Epic Games' backend.
probe {
  name: "gaming_fortnite"
  type: HTTP
  targets {
    host_names: "www.fortnite.com,status.epicgames.com,account-public-service-prod.ol.epicgames.com,fortnite-public-service-prod11.ol.epicgames.com,epicgames-download1.akamaized.net"
  }
  http_probe {
    protocol: HTTPS
    port: 443
  }
  additional_label {
    key: "game"
    value: "fortnite"
  }
  interval_msec: 60000
  timeout_msec: 10000
}

probe {
  name: "gaming_minecraft"
  type: HTTP
  targets {
    host_names: "www.minecraft.net,sessionserver.mojang.com,api.minecraftservices.com,api.mojang.com,piston-meta.mojang.com,resources.download.minecraft.net"
  }
  http_probe {
    protocol: HTTPS
    port: 443
  }
  additional_label {
    key: "game"
    value: "minecraft"
  }
  interval_msec: 60000
  timeout_msec: 10000
}
