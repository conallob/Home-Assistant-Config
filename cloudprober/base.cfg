probe {
  name: "homeassistant"
  type: HTTP
  targets {
    host_names: "homeassistant"
  }
  http_probe {
    protocol: HTTP
    port: 8123
  }
  interval_msec: 30000
  timeout_msec: 5000
}

# gRPC server (cloudprober's control API, plus reflection). Off unless set; the
# homelab cloudprober's gRPC probe below, and the lab's probe of this one,
# both need it. The add-on must also publish this port (and 9313).
grpc_port: 9314

# Peer probes: every cloudprober (this one, the homelab cluster's, and Meadow
# Close's) probes the other two. The cluster's
# (homelab-apps/apps/cloudprober) is reached at its L4 VIP, 192.168.7.2
# (values.yaml: vip); it only accepts the lab subnet and the hosts in
# values.yaml's peerCIDRs, so the routes here must not source-NAT.
#
# HTTP: the peer's /health on its HTTP port.
probe {
  name: "homelab_cloudprober_http"
  type: HTTP
  targets {
    host_names: "192.168.7.2"
  }
  http_probe {
    protocol: HTTP
    port: 9313
    relative_url: "/health"
  }
  interval_msec: 30000
  timeout_msec: 5000
}

# gRPC: lists the peer's probes through its control API. Cloudprober's gRPC
# server has reflection but no grpc.health.v1 service, so HEALTH_CHECK can't be
# used; the GENERIC call is resolved over reflection, so no protoset is needed.
probe {
  name: "homelab_cloudprober_grpc"
  type: GRPC
  targets {
    host_names: "192.168.7.2"
  }
  grpc_probe {
    method: GENERIC
    port: 9314
    # Cloudprober's gRPC server is plaintext unless grpc_tls_config is set.
    insecure_transport: true
    request {
      call_service_method: "cloudprober.Cloudprober.ListProbes"
      body: "{}"
    }
  }
  interval_msec: 30000
  timeout_msec: 5000
}

# Home Assistant, Meadow Close (conallob/home-assistant-meadow-close)
probe {
  name: "homeassistant_meadow_close_cloudprober_http"
  type: HTTP
  targets {
    host_names: "192.168.100.2"
  }
  http_probe {
    protocol: HTTP
    port: 9313
    relative_url: "/health"
  }
  interval_msec: 30000
  timeout_msec: 5000
}

probe {
  name: "homeassistant_meadow_close_cloudprober_grpc"
  type: GRPC
  targets {
    host_names: "192.168.100.2"
  }
  grpc_probe {
    method: GENERIC
    port: 9314
    insecure_transport: true
    request {
      call_service_method: "cloudprober.Cloudprober.ListProbes"
      body: "{}"
    }
  }
  interval_msec: 30000
  timeout_msec: 5000
}

# `include` must start at column 0: Cloudprober only matches ^include.
include "internet_probeset.cfg"
include "gaming_probeset.cfg"


