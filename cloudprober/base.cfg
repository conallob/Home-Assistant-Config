probe {
  name: "homeassistant"
  type: HTTP
  targets {
    host_names: "homeassistant"
  }
  http_probe {
    protocol: HTTP
    port: 8123
  }
  interval_msec: 30000
  timeout_msec: 5000
}

# `include` must start at column 0: Cloudprober only matches ^include.
include "internet_probeset.cfg"

surfacer {
  type: PROMETHEUS
}
