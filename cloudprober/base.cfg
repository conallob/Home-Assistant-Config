probe {
  name: "homeassistant"
  type: HTTP
  targets {
    host_names: "homeassistant"
  }
  http_probe {
    protocol: HTTP
    port: 8123
  }
  interval_msec: 30000
  timeout_msec: 5000
}

# gRPC server (cloudprober's control API, plus reflection). Off unless set; the
# homelab cloudprober's gRPC probe below, and the lab's probe of this one,
# both need it. The add-on must also publish this port (and 9313).
grpc_port: 9314

# Peer probes: every cloudprober (this one, the homelab cluster's, and Meadow
# Close's) probes the other two. The cluster's (homelab-apps/apps/cloudprober)
# is reached at its L4 VIP, 192.168.7.2 (values.yaml: vip); it only accepts the
# lab subnet and the hosts in values.yaml's peerCIDRs, so the routes here must
# not source-NAT.
#
# Every metric this cloudprober publishes also carries its own source labels,
# `site=woodlands,deployment=homeassistant`, which cloudprober stamps itself at
# publication time from the CLOUDPROBER_ADDITIONAL_LABELS environment variable:
# set it in the add-on's environment, it can't be set here.
#
# The probes themselves are the shared stanza in peer_probes.cfg; this file only
# says who the peers are. Adding a peer is one `dict` here (and its CIDR in the
# cluster's values.yaml).
{{ $peers := list
  (dict "name" "homelab-cluster" "ip" "192.168.7.2" "site" "homelab")
  (dict "name" "homeassistant-meadow-close" "ip" "192.168.100.2" "site" "meadow-close") }}

# `include` must start at column 0: Cloudprober only matches ^include.
# Where this directory is mounted in the Home Assistant add-on: the add-on's
# extra_config_path is cloudprober/base.cfg, relative to /homeassistant. The
# gaming probe's file_targets path is built from it (the add-on's main config is
# the generated /data/cloudprober/cloudprober.cfg, so the configDir template
# function would point there instead).
{{ $dir := "/homeassistant/cloudprober" }}

include "peer_probes.cfg"
include "internet_probeset.cfg"
include "gaming_probeset.cfg"


