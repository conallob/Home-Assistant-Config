probe {
  name: "homeassistant"
  type: HTTP
  targets {
    host_names: "homeassistant"
  }
  http_probe {
    protocol: HTTP
    port: 8123
  }
  interval_msec: 30000
  timeout_msec: 5000
}

# gRPC server (cloudprober's control API, plus reflection). Off unless set; the
# homelab cloudprober's gRPC probe below, and the lab's probe of this one,
# both need it. The add-on must also publish this port (and 9313).
grpc_port: 9314

# Peer probes: every cloudprober (this one, the homelab cluster's, and Meadow
# Close's) probes the other two. The cluster's
# (homelab-apps/apps/cloudprober) is reached at its L4 VIP, 192.168.7.2
# (values.yaml: vip); it only accepts the lab subnet and the hosts in
# values.yaml's peerCIDRs, so the routes here must not source-NAT.
#
# One probe per protocol, one endpoint per peer: the port, path and call are
# the same everywhere, so only the target varies, and its `dst_site` label (and
# `dst`, the endpoint name) tells the series apart. Same probe names, endpoint
# names and labels as homelab-apps/apps/cloudprober/config/cloudprober.cfg, so
# one query covers all three sites. Adding a peer is one endpoint in each
# probe.
#
# Every metric this cloudprober publishes also carries its own source labels,
# `site=woodlands,deployment=homeassistant`,
# which cloudprober stamps itself at publication time from the
# CLOUDPROBER_ADDITIONAL_LABELS environment variable: set it in the add-on's
# environment, it can't be set here. The target label is dst_site, never site:
# a label a probe sets itself overrides the stamped one, so the source site
# would silently vanish.

# HTTP: the peer's /health on its HTTP port.
probe {
  name: "cloudprober_peer_http"
  type: HTTP
  targets {
    endpoint { name: "homelab-cluster" ip: "192.168.7.2"
      labels { key: "dst_site" value: "homelab" } }
    endpoint { name: "homeassistant-meadow-close" ip: "192.168.100.2"
      labels { key: "dst_site" value: "meadow-close" } }
  }
  http_probe {
    protocol: HTTP
    port: 9313
    relative_url: "/health"
  }
  additional_label {
    key: "dst_site"
    value: "@target.label.dst_site@"
  }
  interval_msec: 30000
  timeout_msec: 5000
}

# gRPC: lists the peer's probes through its control API. Cloudprober's gRPC
# server has reflection but no grpc.health.v1 service, so HEALTH_CHECK can't be
# used; the GENERIC call is resolved over reflection, so no protoset is needed.
# The server is plaintext unless grpc_tls_config is set, hence
# insecure_transport.
probe {
  name: "cloudprober_peer_grpc"
  type: GRPC
  targets {
    endpoint { name: "homelab-cluster" ip: "192.168.7.2"
      labels { key: "dst_site" value: "homelab" } }
    endpoint { name: "homeassistant-meadow-close" ip: "192.168.100.2"
      labels { key: "dst_site" value: "meadow-close" } }
  }
  grpc_probe {
    method: GENERIC
    port: 9314
    insecure_transport: true
    request {
      call_service_method: "cloudprober.Cloudprober.ListProbes"
      body: "{}"
    }
  }
  additional_label {
    key: "dst_site"
    value: "@target.label.dst_site@"
  }
  interval_msec: 30000
  timeout_msec: 5000
}

# `include` must start at column 0: Cloudprober only matches ^include.
include "internet_probeset.cfg"
include "gaming_probeset.cfg"


