# Probeset: external internet reachability.
# Cloudprober has no first-class "probeset" object; a probe with multiple
# targets is the idiomatic equivalent, and yields one series per target.
probe {
  name: "internet"
  type: HTTP
  targets {
    host_names: "www.google.com,www.netflix.com"
  }
  http_probe {
    protocol: HTTPS
    port: 443
  }
  interval_msec: 30000
  timeout_msec: 5000
}
