# Peer probes: one HTTP and one gRPC probe of every other cloudprober in the
# mesh, generated from the `$peers` list that the including config defines
# before it includes this file (a Go template variable: includes are textual
# and expanded before templating, so it is visible here). Identical in
# homelab-apps (apps/cloudprober/config/), Home-Assistant-Config
# (cloudprober/) and home-assistant-meadow-close (cloudprober/), so the
# stanza is maintained in one shape; only each site's `$peers` differs.
#
# Each peer is a dict with:
#   name  the endpoint name, exported as `dst`
#   ip    its address (HTTP /health on 9313, gRPC on 9314)
#   site  its site, exported as `dst_site`
# The target label is dst_site, never site: a label a probe sets itself
# overrides the `site` this cloudprober stamps on everything it publishes
# (CLOUDPROBER_ADDITIONAL_LABELS), so the source site would silently vanish.
# A series therefore reads "from site, to dst_site".
#
# HTTP: the peer's /health on its HTTP port.
# gRPC: lists the peer's probes through its control API. Cloudprober's gRPC
# server has reflection but no grpc.health.v1 service, so HEALTH_CHECK can't be
# used; the GENERIC call is resolved over reflection, so no protoset is needed.
# The server is plaintext unless grpc_tls_config is set, hence
# insecure_transport.
{{ range $proto := list "http" "grpc" }}
probe {
  name: "cloudprober_peer_{{ $proto }}"
  type: {{ upper $proto }}
  targets {
{{- range $peers }}
    endpoint {
      name: "{{ .name }}"
      ip: "{{ .ip }}"
      labels {
        key: "dst_site"
        value: "{{ .site }}"
      }
    }
{{- end }}
  }
{{- if eq $proto "http" }}
  http_probe {
    protocol: HTTP
    port: 9313
    relative_url: "/health"
  }
{{- else }}
  grpc_probe {
    method: GENERIC
    port: 9314
    insecure_transport: true
    request {
      call_service_method: "cloudprober.Cloudprober.ListProbes"
      body: "{}"
    }
  }
{{- end }}
  additional_label {
    key: "dst_site"
    value: "@target.label.dst_site@"
  }
  interval_msec: 30000
  timeout_msec: 5000
}
{{ end }}
