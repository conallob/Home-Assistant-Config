# Grid import energy split by Irish time-of-use band (day / peak / night).
# Bands are switched by automation/rotate_electricity_meter_counter.yaml, which
# selects the active tariff on each of the selects these meters create.
# Cost tallies derived from these live in template/electricity_cost.yaml.
daily_electricity_energy:
  source: sensor.grid_em_channel_1_energy
  name: Daily Electricity Meter Energy
  cycle: daily
  tariffs:
    - day
    - peak
    - night
monthly_electricity_energy:
  source: sensor.grid_em_channel_1_energy
  name: Monthly Electricity Meter Energy
  cycle: monthly
  tariffs:
    - day
    - peak
    - night
yearly_electricity_energy:
  source: sensor.grid_em_channel_1_energy
  name: Yearly Electricity Meter Energy
  cycle: yearly
  tariffs:
    - day
    - peak
    - night
# Only exists to hold the active band for sensor.current_electricity_rate.
current_electricity_tariff:
  source: sensor.grid_em_channel_1_energy
  name: Current Electricity Tariff
  cycle: daily
  tariffs:
    - day
    - peak
    - night
