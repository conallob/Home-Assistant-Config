# Tesco Ireland - Wicklow Wolf Tundra Tropical IPA price tracker
# https://www.tesco.ie/shop/en-IE/products/316180014
#
# Same JSON-LD / Open Graph price extraction strategy as the other beer_price_*
# sensors - see rest/beer_price_obrienswine.yaml for the rationale. Refreshed
# once a day.
#
# Tesco Ireland frequently runs a lower "Clubcard Price" (member price)
# alongside the regular price - e.g. currently EUR3.00 vs. a higher regular
# price. When a member price is present in the page data it's tracked in
# preference to the regular price, since that's the price actually payable
# with a Clubcard. The `is_member_price` attribute records which one was used
# so this can be told apart from a straight regular-price read.
#
# KNOWN LIMITATION (2026-08-24): this sensor cannot currently work. Confirmed
# via curl -v against the live URL that www.tesco.ie sits behind Akamai bot
# management and returns a plain HTTP 403 "Access Denied" (Akamai edge error,
# not even a JS challenge page) for any plain (non-browser) request - so no
# regex tuning here can fix it, and the clubcard/member-price key name below
# remains unverified since the real page HTML has never been reachable. This
# is a request-level block before the page is ever served, not a
# markup/selector issue.
#
# sensor.beer_price_tesco, sensor.beer_price_tesco_is_member_price, and
# sensor.beer_price_tesco_regular_price are all expected to read
# "unavailable"/false until a different approach is found (e.g. a
# self-hosted/undetected browser fetch).

resource: "https://www.tesco.ie/shop/en-IE/products/316180014"
scan_interval: 86400
headers:
  User-Agent: "Mozilla/5.0 (compatible; HomeAssistant/beer-price-tracker)"
sensor:
  - name: "Beer Price Tesco"
    unique_id: beer_price_tesco
    unit_of_measurement: "EUR"
    device_class: monetary
    state_class: measurement
    value_template: >-
      {% set member = value | regex_findall('"(?:clubcardPrice|memberPrice|loyaltyPrice|promoPrice)"\s*:\s*"?([0-9]+\.[0-9]{2})"?') %}
      {% set ld = value | regex_findall('"price"\s*:\s*"?([0-9]+\.[0-9]{2})"?') %}
      {% set og = value | regex_findall('product:price:amount"\s+content="([0-9]+\.[0-9]{2})"') %}
      {% if member %}
        {{ member[0] }}
      {% elif ld %}
        {{ ld[0] }}
      {% elif og %}
        {{ og[0] }}
      {% else %}
        unavailable
      {% endif %}

  # The `rest` sensor platform has no generic templated-attributes option
  # (only json_attributes, which needs a JSON response body - ours is HTML),
  # so the member-price flag and regular price are tracked as their own
  # sibling sensors off the same fetched resource instead of as attributes.
  - name: "Beer Price Tesco Is Member Price"
    unique_id: beer_price_tesco_is_member_price
    value_template: >-
      {% set member = value | regex_findall('"(?:clubcardPrice|memberPrice|loyaltyPrice|promoPrice)"\s*:\s*"?([0-9]+\.[0-9]{2})"?') %}
      {{ member | length > 0 }}

  - name: "Beer Price Tesco Regular Price"
    unique_id: beer_price_tesco_regular_price
    unit_of_measurement: "EUR"
    device_class: monetary
    state_class: measurement
    value_template: >-
      {% set ld = value | regex_findall('"price"\s*:\s*"?([0-9]+\.[0-9]{2})"?') %}
      {{ ld[0] if ld else 'unavailable' }}
