# SuperValu (shop.supervalu.ie) - Wicklow Wolf Tundra Tropical IPA (440ml can) price tracker
# https://shop.supervalu.ie/sm/delivery/rsid/5550/product/wicklow-wolf-tundra-tropical-ipa-can-440-ml-id-1675882007
#
# Same JSON-LD / Open Graph price extraction strategy as the other beer_price_*
# sensors - see rest/beer_price_obrienswine.yaml for the rationale. Refreshed
# once a day.
#
# CONFIRMED (2026-08-24) via curl against the live URL: the price IS present
# in the plain (non-JS-executed) HTML response - no headless browser needed.
# It shows up twice: a `<meta itemprop="price" content="€3.20" />` tag, and
# inside an inline `window.__PRELOADED_STATE__` JSON blob as
# `"price":"€3.20"` / `"lineItemPrice":"€3.20"`. In both places the value is
# a string with the euro symbol embedded directly before the digits (e.g.
# "€3.20", not a bare "3.20"), so the regex below tolerates an optional
# currency symbol immediately after the opening quote/attribute delimiter.

resource: "https://shop.supervalu.ie/sm/delivery/rsid/5550/product/wicklow-wolf-tundra-tropical-ipa-can-440-ml-id-1675882007"
scan_interval: 86400
headers:
  User-Agent: "Mozilla/5.0 (compatible; HomeAssistant/beer-price-tracker)"
sensor:
  - name: "Beer Price SuperValu"
    unique_id: beer_price_supervalu
    unit_of_measurement: "EUR"
    device_class: monetary
    state_class: measurement
    value_template: >-
      {% set ld = value | regex_findall('"(?:line)?[Pp]rice"\s*:\s*"?[€$£]?([0-9]+\.[0-9]{2})"?') %}
      {% set meta = value | regex_findall('itemprop="price"\s+content="[€$£]?([0-9]+\.[0-9]{2})"') %}
      {% set og = value | regex_findall('product:price:amount"\s+content="[€$£]?([0-9]+\.[0-9]{2})"') %}
      {% if ld %}
        {{ ld[0] }}
      {% elif meta %}
        {{ meta[0] }}
      {% elif og %}
        {{ og[0] }}
      {% else %}
        unavailable
      {% endif %}
