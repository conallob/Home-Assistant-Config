id: workphone_focus_activity_toggle
alias: WorkPhone Focus - Start/Stop Matching Activity
description: >
  When Conall's WorkPhone (sensor.workphone_focus) enters a custom Focus,
  starts the matching activity script if one exists - script.workphone_focus_<slug>,
  e.g. entering Focus "Work" runs script.workphone_focus_work - and stops the
  previous Focus's matching script when it exits. To wire up a Focus, add a
  script named after it (lowercase, spaces to underscores); Focus names
  without a matching script are ignored.
triggers:
  - trigger: state
    entity_id: sensor.workphone_focus
conditions: []
actions:
  - variables:
      old_script: >
        {{ 'script.workphone_focus_' ~ (trigger.from_state.state | default('', true) | lower | replace(' ', '_')) }}
      new_script: >
        {{ 'script.workphone_focus_' ~ (trigger.to_state.state | default('', true) | lower | replace(' ', '_')) }}
  - if:
      - condition: template
        value_template: "{{ old_script in states.script | map(attribute='entity_id') | list }}"
    then:
      - action: script.turn_off
        target:
          entity_id: "{{ old_script }}"
  - if:
      - condition: template
        value_template: "{{ new_script in states.script | map(attribute='entity_id') | list }}"
    then:
      - action: script.turn_on
        target:
          entity_id: "{{ new_script }}"
mode: single
