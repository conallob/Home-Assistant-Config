id: '1768775775753'
alias: Git Pull Configs from Github Actions
description: Update Configuration on Github Push Event
triggers:
- webhook_id: github_git_pull_config
  local_only: false
  trigger: webhook
  allowed_methods:
  - POST
  - PUT
conditions: []
actions:
- action: shell_command.git_pull_config
  data: {}
- action: rest.reload
  data: {}
# git pull only updates files on disk; each domain needs reloading to pick them up.
# Order matters: helpers and templates first, since automations reference them.
# automation.reload goes last because it reloads this automation too.
- action: input_number.reload
  data: {}
- action: input_datetime.reload
  data: {}
- action: template.reload
  data: {}
- action: automation.reload
  data: {}
mode: single
