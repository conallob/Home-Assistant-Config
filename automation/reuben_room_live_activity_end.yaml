id: '1779000000002'
alias: Reuben Room - Warm-up Live Activity End
description: >
  Ends the Reuben room warm-up Live Activity: shows "warm" for 10 minutes
  once the room reaches the target, and clears it at the end of the Lie In
  window (07:30). clear_notification is harmless if no activity is open.
triggers:
  - trigger: numeric_state
    entity_id: sensor.atc_f299_temperature
    above: input_number.reuben_room_floor_setpoint
    for:
      minutes: 2
    id: reached
  - trigger: time
    at: '07:30:00'
    id: window_end
conditions: []
actions:
  - if:
      - condition: trigger
        id: reached
    then:
      - action: notify.conall_phone
        data:
          title: "Reuben's room"
          message: "Warm: {{ states('sensor.atc_f299_temperature') | float(0) | round(1) }}°C"
          data:
            tag: reuben_room_warmup
            live_update: true
            silent: true
            progress: 1
            progress_max: 1
            critical_text: "Warm"
            notification_icon: mdi:radiator
            notification_icon_color: "#4CAF50"
            color: "#4CAF50"
      - delay: "00:10:00"
  - action: notify.conall_phone
    data:
      message: clear_notification
      data:
        tag: reuben_room_warmup
mode: restart
