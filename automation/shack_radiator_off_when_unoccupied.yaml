id: shack_radiator_off_when_unoccupied
alias: Shack Radiator - Off When Unoccupied (Failsafe)
description: >-
  Failsafe so the Shack radiator is never left heating an empty room (e.g.
  overnight). On weekdays at 16:45 and 18:45, if binary_sensor.shack_presence
  shows nobody there and the radiator is heating, wait 15 minutes (i.e. until
  17:00 / 19:00). If presence is detected at any point in that window, do
  nothing; if the Shack stays empty for the full 15 minutes, turn the radiator
  off.
triggers:
- trigger: time
  at: '16:45:00'
- trigger: time
  at: '18:45:00'
conditions:
- condition: time
  weekday:
  - mon
  - tue
  - wed
  - thu
  - fri
- condition: state
  entity_id: binary_sensor.shack_presence
  state: 'off'
- condition: not
  conditions:
  - condition: state
    entity_id: climate.shack_heater
    state:
    - 'off'
    - unavailable
    - unknown
actions:
- wait_for_trigger:
  - trigger: state
    entity_id: binary_sensor.shack_presence
    to: 'on'
  timeout:
    minutes: 15
  continue_on_timeout: true
- if:
  - condition: template
    value_template: "{{ wait.trigger is none }}"
  - condition: state
    entity_id: binary_sensor.shack_presence
    state: 'off'
  then:
  - action: climate.turn_off
    target:
      entity_id: climate.shack_heater
mode: single
