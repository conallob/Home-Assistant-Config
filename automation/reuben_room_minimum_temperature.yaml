id: '1767000000001'
alias: Reuben Room - Minimum Temperature Guard
description: >
  Alert-only safety net for Reuben's room. The floor itself
  (input_number.reuben_room_floor_temp, default 18C, applied at all times) is
  enforced by "Upstairs Heating - Controller". If the room is still below the
  floor 45 minutes later, the controller's heating isn't working (boiler, Nest,
  TRV or sensor fault), so tell a human.
triggers:
  - trigger: numeric_state
    entity_id: sensor.atc_f299_temperature
    below: input_number.reuben_room_floor_temp
    for:
      minutes: 45
actions:
  - action: persistent_notification.create
    data:
      notification_id: reuben_room_cold
      title: Reuben's room is cold
      message: >
        {{ states('sensor.atc_f299_temperature') }}C, still below
        {{ states('input_number.reuben_room_floor_temp') }}C after 45 minutes.
        Check the "Upstairs Heating - Controller" trace, the upstairs Nest and
        climate.reuben_trv.
mode: single
