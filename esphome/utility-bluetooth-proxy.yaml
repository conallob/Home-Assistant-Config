esphome:
  name: utility-bluetooth-proxy
  friendly_name: "Utility Bluetooth Proxy"

esp32:
  board: seeed_xiao_esp32c6
  framework:
    type: esp-idf

# Enable logging
logger:

# Enable IPv6
network:
    enable_ipv6: true

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key_utility_bluetooth_proxy

ota:
  platform: esphome
  password: !secret ota_password_utility_bluetooth_proxy

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Bluetooth Proxy to Home Assistant
esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 1100ms
    active: true

bluetooth_proxy:
  active: true

# 24GHz mmWave Human Static Presence expansion board (LD2410),
# used to detect Huck's presence in the utility room.
# Board mounts directly onto the XIAO's D2/D3 pins.
uart:
  id: mmwave_uart
  tx_pin: GPIO21
  rx_pin: GPIO2
  baud_rate: 256000 # LD2410 chip default; not user-configurable without reflashing the module
  parity: NONE
  stop_bits: 1

ld2410:
  id: utility_room_mmwave

binary_sensor:
  - platform: ld2410
    has_target:
      name: "Presence"
    has_moving_target:
      name: "Moving Target"
    has_still_target:
      name: "Still Target"

sensor:
  - platform: ld2410
    moving_distance:
      name: "Moving Distance"
    still_distance:
      name: "Still Distance"
    moving_energy:
      name: "Moving Energy"
    still_energy:
      name: "Still Energy"
    detection_distance:
      name: "Detection Distance"

text_sensor:
  - platform: ld2410
    version:
      name: "Presence Sensor Firmware Version"

switch:
  - platform: ld2410
    engineering_mode:
      name: "Presence Sensor Engineering Mode"
      # Turn on temporarily while tuning gate thresholds above - it makes
      # the per-gate Moving/Still Energy sensors report live values instead
      # of just the aggregate ones, which makes it much easier to see which
      # gate covers the bed. Turn back off once tuned to reduce UART chatter.

button:
  - platform: ld2410
    restart:
      name: "Presence Sensor Restart"

number:
  - platform: ld2410
    timeout:
      name: "Presence Sensor Timeout"
    max_move_distance_gate:
      name: "Presence Sensor Max Move Distance"
    max_still_distance_gate:
      name: "Presence Sensor Max Still Distance"
    # Per-gate sensitivity (gates are ~0.75m bands from the sensor).
    # Flakiness is usually a still_threshold set too high for the gate(s)
    # covering the bed, causing brief drop-outs while Huck is lying still.
    # Tune via the HA UI: watch the "Still Energy"/"Moving Energy" sensors
    # while he's in and out of the bed, then set the still/move thresholds
    # for the bed's gate(s) just below the "in bed" energy readings.
    g0:
      move_threshold:
        name: "Presence Sensor G0 Move Threshold"
      still_threshold:
        name: "Presence Sensor G0 Still Threshold"
    g1:
      move_threshold:
        name: "Presence Sensor G1 Move Threshold"
      still_threshold:
        name: "Presence Sensor G1 Still Threshold"
    g2:
      move_threshold:
        name: "Presence Sensor G2 Move Threshold"
      still_threshold:
        name: "Presence Sensor G2 Still Threshold"
    g3:
      move_threshold:
        name: "Presence Sensor G3 Move Threshold"
      still_threshold:
        name: "Presence Sensor G3 Still Threshold"
