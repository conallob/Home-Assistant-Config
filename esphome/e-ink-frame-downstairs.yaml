
substitutions:
  # Device Info
  device_name: "e-ink-frame-downstairs"
  friendly_name: "E-Ink Frame Downstairs"

  # Pin Assignments for XIAO ESP32C6 to Waveshare e-Paper Driver HAT (Rev2.3)
  # Using hardware SPI pins for reliable communication
  # XIAO ESP32C6 pinout: https://wiki.seeedstudio.com/xiao_esp32c6_getting_started/
  # Waveshare HAT connector directly to XIAO expansion board
  #
  # DUPONT WIRE MAP (XIAO expansion board <-> Waveshare e-Paper Driver HAT 9-pin
  # connector). Confirmed against a labelled product photo of the actual Driver
  # HAT Rev2.3 board in this build: the 9-pin connector is silkscreened
  # PWR,BUSY,RST,DC,CS,CLK,DIN,GND,VCC (left to right), with a matching 9-wire
  # cable in that same colour order. This is the real cable for this board -
  # not a generic/assumed convention.
  #
  # | HAT Pin | Signal | Colour | XIAO Pin | GPIO   | Notes |
  # |---------|--------|--------|----------|--------|-------|
  # | 1       | PWR    | Purple | 3V3      | -      | No power_pin in ESPHome's waveshare_epaper component - tie PWR straight to 3V3 (same rail as VCC) rather than a GPIO. CURRENTLY DISCONNECTED - reconnect here. |
  # | 2       | BUSY   | Blue   | D5       | GPIO23 | Busy signal (ACTIVE LOW - must be inverted!) |
  # | 3       | RST    | Green  | D4       | GPIO22 | Reset |
  # | 4       | DC     | Yellow | D3       | GPIO21 | Data/Command |
  # | 5       | CS     | Orange | D2       | GPIO2  | Chip Select |
  # | 6       | CLK    | Grey   | D8       | GPIO19 | SPI SCK (hardware SPI) |
  # | 7       | DIN    | White  | D10      | GPIO18 | SPI MOSI (hardware SPI) |
  # | 8       | GND    | Black  | GND      | -      | |
  # | 9       | VCC    | Red    | 3V3      | -      | |
  #
  # If a wire ever comes loose again and colour alone isn't enough to confirm:
  # multimeter in continuity/beep mode, one probe on the HAT-side pin, the
  # other on the candidate XIAO pin - it beeps when you've found the right one.
  pin_clk: "GPIO19"   # D8 - SPI SCK (hardware SPI) - Grey wire
  pin_mosi: "GPIO18"  # D10 - SPI MOSI (hardware SPI) - White wire
  pin_cs: "GPIO2"     # D2 - Chip Select - Orange wire
  pin_dc: "GPIO21"    # D3 - Data/Command - Yellow wire
  pin_busy: "GPIO23"  # D5 - Busy signal (ACTIVE LOW - must be inverted!) - Blue wire
  pin_reset: "GPIO22" # D4 - Reset - Green wire

  # MAX17043 LiPo fuel gauge (18650 cell, battery backup power).
  # D0/D1/D6/D7/D9 are the only XIAO pins not already claimed above by the
  # e-ink SPI bus or deep-sleep wake. The board's own dedicated I2C pins
  # (D4/D5 - GPIO22/23) are already used for the e-ink RESET/BUSY signals,
  # and D6/D7 (GPIO16/17) double as U0TXD/U0RXD - ESPHome's default
  # hardware-UART logger output - so I2C activity there could corrupt
  # both the log and the bus. D0/D1 (GPIO0/GPIO1) have no default
  # peripheral role on this chip, so they're used instead.
  # Board wires: Black=GND, Red=VCC (3V3), Yellow=SDA, Green=SCL - this
  # colour convention is this specific breakout's, not a universal
  # standard. If the device doesn't show up on the I2C bus (address 0x36)
  # after wiring, swap the SDA/SCL pins below first.
  #
  # PHYSICAL WIRING CHECKLIST (MAX17043 breakout -> XIAO ESP32C6):
  #   Black (GND) -> GND
  #   Red   (VCC) -> 3V3
  #   Yellow(SDA) -> D0 / GPIO0
  #   Green (SCL) -> D1 / GPIO1
  # Physically wired as of 2026-09-01.
  pin_i2c_sda: "GPIO0" # D0 - I2C SDA - Yellow wire
  pin_i2c_scl: "GPIO1" # D1 - I2C SCL - Green wire

  # Onboard Bat+/Bat- solder pads (XIAO ESP32C6's single-cell Li-ion/LiPo
  # charge circuit, ~3.7V nominal / 4.2V full charge). A JST connector was
  # soldered to these pads and wired to a 2x 18650 cell holder for battery
  # backup power.
  #
  # IMPORTANT - series vs. parallel: the onboard charge IC is rated for a
  # SINGLE cell. Two cells in series (~7.4-8.4V) would exceed that rating
  # and risks damaging the board/cells - the holder must be wired in
  # PARALLEL (both cells stay at ~3.7-4.2V, capacity doubles) for this to
  # be safe to leave connected. Cells were observed in the same physical
  # orientation in the holder, which is consistent with parallel wiring
  # (series holders typically need cells flipped so the connecting tab
  # bridges + to -), but this has NOT yet been confirmed with a
  # multimeter across Bat+/Bat- - do that before leaving this connected
  # unattended, and disconnect immediately if the reading is above ~4.2V.
  #
  # Note: unlike the XIAO ESP32S3 (which has a built-in resistor divider
  # exposing battery voltage on pin A0), the XIAO ESP32C6 has no built-in
  # ADC tap on Bat+ - reading voltage that way would require soldering an
  # external divider onto a free ADC-capable pin, and isn't done here.
  # Battery voltage/level for this build is read via the MAX17043 fuel
  # gauge on the I2C bus above, not via a direct ADC read of Bat+.

  # Deep Sleep
  gpio_deep_sleep_wake_up: "GPIO4"
  sleep_duration: "30min"

  # Location
  latitude: !secret taku_coords_lat
  longitude: !secret taku_coords_lon
  timezone: "Europe/Dublin"

  # Display - Waveshare 7.3" e-Paper HAT (G) 4-Color (800x480)
  # Actual display: HAT (G) with Black, White, Red, Yellow
  # Using 7.30in-f driver (no native HAT G support yet)
  # Color mapping applied in color: section to correct for driver differences
  waveshare_model: "7.30in-f"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  # Display refresh strategy:
  # - Initial refresh once after first time sync (ensures HA data is available)
  # - Scheduled refresh every ~7.5 minutes (8 times per hour)
  # - Refresh disabled when:
  #   - After 23:00 (11 PM)
  #   - Alarm is armed away
  #   - Nobody is home (zone.home has no persons)
  #   - Taku Sleep Mode is active (device enters deep sleep)
  # - Manual refresh available via button in Home Assistant
  on_boot:
    priority: -100  # Run after everything is initialized
    then:
      - delay: 5s  # Wait for HA connection and sensor updates
      - if:
          condition:
            binary_sensor.is_on: taku_sleep_mode
          then:
            - logger.log: "Woke from deep sleep but Taku Sleep Mode still active - going back to sleep"
            - delay: 2s
            - deep_sleep.enter: deep_sleep_control

esp32:
  board: seeed_xiao_esp32c6
  framework:
    type: esp-idf

# Enable logging
logger:
  level: DEBUG

# Enable IPv6
network:
  enable_ipv6: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key_e_ink_frame_downstairs

ota:
  - platform: esphome
    password: !secret ota_password_e_ink_frame_downstairs

web_server:
  port: 80

# SPI Configuration for e-ink display
spi:
  clk_pin: ${pin_clk}
  mosi_pin: ${pin_mosi}
  id: spi_bus

# I2C bus for the MAX17043 LiPo fuel gauge
i2c:
  sda: ${pin_i2c_sda}
  scl: ${pin_i2c_scl}
  id: i2c_bus

# Global to track if initial refresh has happened
globals:
  - id: initial_refresh_done
    type: bool
    restore_value: no
    initial_value: 'false'

# Time component
time:
  - platform: homeassistant
    id: homeassistant_time
    timezone: ${timezone}
    on_time_sync:
      then:
        # Only refresh on first time sync after boot
        - if:
            condition:
              lambda: 'return !id(initial_refresh_done);'
            then:
              - logger.log: "Initial time sync - triggering first display refresh..."
              - delay: 3s  # Give sensors time to receive their initial values
              - component.update: eink_display
              - globals.set:
                  id: initial_refresh_done
                  value: 'true'
            else:
              - logger.log: "Time re-synced, skipping refresh (use scheduled refresh)"
    # Scheduled refresh every ~7.5 minutes
    # Disabled when: after 23:00, alarm armed away, or nobody home
    on_time:
      # First set: :00, :15, :30, :45
      - seconds: 0
        minutes: /15
        then:
          - script.execute: scheduled_refresh
      # Second set: :08, :23, :38, :53 (offset by ~7.5 min)
      - seconds: 0
        minutes: 8,23,38,53
        then:
          - script.execute: scheduled_refresh

# Script to handle conditional refresh
script:
  - id: scheduled_refresh
    then:
      - if:
          condition:
            lambda: |-
              auto time = id(homeassistant_time).now();

              // Skip refresh after 23:00 (11 PM)
              if (time.hour >= 23) {
                ESP_LOGI("display", "Skipping refresh: after 23:00");
                return false;
              }

              // Skip refresh if alarm is armed away
              if (id(alarm_state).has_state()) {
                std::string alarm = id(alarm_state).state;
                if (alarm == "armed_away") {
                  ESP_LOGI("display", "Skipping refresh: alarm armed away");
                  return false;
                }
              }

              // Skip refresh if nobody is home (zone.home persons is empty)
              if (id(zone_home_persons).has_state()) {
                std::string persons = id(zone_home_persons).state;
                // Empty list is "[]" or just empty
                if (persons == "[]" || persons.empty()) {
                  ESP_LOGI("display", "Skipping refresh: nobody home");
                  return false;
                }
              }

              ESP_LOGI("display", "Scheduled refresh: conditions met, updating display");
              return true;
          then:
            - component.update: eink_display

# Sun component for sunrise/sunset
sun:
  latitude: ${latitude}
  longitude: ${longitude}

# Define colors for Waveshare 7.3" e-Paper HAT (G) 4-Color display
# The display supports: Black, White, Red, Yellow
# Using 7.30in-f (7-color) driver with color mapping adjustments:
#   - What the driver calls "green" displays as Yellow on HAT (G)
#   - What the driver calls "blue" displays as Red on HAT (G)
#
# Color mapping for HAT (G):
#   Driver Color  -> HAT (G) Display
#   Black         -> Black
#   White         -> White
#   Green         -> Yellow
#   Blue          -> Red
#
color:
  - id: color_black
    red: 0%
    green: 0%
    blue: 0%
    white: 0%

  - id: color_white
    red: 100%
    green: 100%
    blue: 100%
    white: 100%

  # For HAT (G): Use driver's "green" channel to display YELLOW
  - id: color_yellow
    red: 0%
    green: 100%
    blue: 0%

  # For HAT (G): Use driver's "blue" channel to display RED
  - id: color_red
    red: 0%
    green: 0%
    blue: 100%

# Fonts - TRMNL-inspired typography
font:
  # Small text for labels and secondary info
  - file: "gfonts://Roboto"
    id: font_small
    size: 18

  # Regular body text
  - file: "gfonts://Roboto"
    id: font_body
    size: 22

  # Body text + Euro sign, for the account balance rows only.
  # NOTE: ESPHome's `glyphs` option *replaces* the font's default glyph
  # set rather than extending it, so this must list out the full set of
  # characters these rows need (not just the extra symbol) - it must not
  # be added to font_body directly, or every other character in that font
  # disappears.
  - file: "gfonts://Roboto"
    id: font_currency
    size: 22
    glyphs: "€0123456789.- ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz"

  # Medium for section content
  - file: "gfonts://Roboto"
    id: font_medium
    size: 28

  # Bold, for the bus bubbles' route codes (originally also used for the
  # top bubble row's date/weather-temp values, both since moved to their
  # own dedicated fonts). Bumped 34 -> 40 alongside font_icons_bus once
  # the bus bubbles grew tall enough to make both worth enlarging - see
  # the BUS DEPARTURE BUBBLES comment for the width math behind the size.
  - file: "gfonts://Roboto@700"
    id: font_bubble_value
    size: 40

  # Bold for the top bubble row's labels and weather condition text
  - file: "gfonts://Roboto@700"
    id: font_bubble_label
    size: 20

  # Medium-large for the (now compact) header time display. Bumped from
  # 48 - kept within the fixed 186px-wide Time/Date bubble (5 chars incl.
  # colon at ~0.62em/char needs to stay under ~170px usable width after
  # padding; 54 was the largest that comfortably fit without clipping).
  - file: "gfonts://Roboto@700"
    id: font_time
    size: 54

  # Bold for section headers
  - file: "gfonts://Roboto@700"
    id: font_header
    size: 24

  # Extra large - the header weather bubble's temperature and AQI number
  # (previously defined but unused).
  - file: "gfonts://Roboto@700"
    id: font_temp_large
    size: 56

  # Huge, for the Date bubble's tear-off-calendar-style day-of-month
  # number - the bubble's dominant element, similar to a paper desk
  # calendar page.
  - file: "gfonts://Roboto@700"
    id: font_calendar_day
    size: 64

  # Material Design Icons - Weather, sized for the header weather bubble.
  # font_icons_medium doesn't include the weather glyphs at all - using it
  # for weather icons previously rendered as blank squares. Bumped from
  # 42 to 56 now that the bubble is single-line (icon + temp only, no
  # condition/feels-like/humidity text below it needing the space) - also
  # carries the AQI icon so it matches the weather icon's size.
  - file: 'https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf'
    id: font_icons_weather
    size: 56
    glyphs:
      - "\U000F0D43" # mdi:air-filter (AQI)
      - "\U000F0590" # mdi:weather-cloudy
      - "\U000F0591" # mdi:weather-fog
      - "\U000F0592" # mdi:weather-hail
      - "\U000F0593" # mdi:weather-lightning
      - "\U000F067E" # mdi:weather-lightning-rainy
      - "\U000F0594" # mdi:weather-night
      - "\U000F0595" # mdi:weather-partlycloudy
      - "\U000F0596" # mdi:weather-pouring
      - "\U000F0597" # mdi:weather-rainy
      - "\U000F0598" # mdi:weather-snowy
      - "\U000F067F" # mdi:weather-snowy-rainy
      - "\U000F0599" # mdi:weather-sunny
      - "\U000F059D" # mdi:weather-windy
      - "\U000F059E" # mdi:weather-windy-variant
      - "\U000F0F31" # mdi:weather-night-partly-cloudy

  # Material Design Icons - Medium (UI elements)
  - file: 'https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf'
    id: font_icons_medium
    size: 32
    glyphs:
      - "\U000F050F" # mdi:thermometer
      - "\U000F058E" # mdi:water-percent (humidity)
      - "\U000F0F54" # mdi:home-thermometer
      - "\U000F0A02" # mdi:calendar-today
      - "\U000F0954" # mdi:calendar-clock
      - "\U000F05CE" # mdi:wifi
      - "\U000F091F" # mdi:wifi-strength-1
      - "\U000F0922" # mdi:wifi-strength-4
      - "\U000F059B" # mdi:weather-sunset-down
      - "\U000F059C" # mdi:weather-sunset-up
      - "\U000F0238" # mdi:fire (heating)
      - "\U000F18D6" # mdi:sun-thermometer-outline
      - "\U000F0A72" # mdi:transmission-tower (grid)
      - "\U000F05A8" # mdi:white-balance-sunny (solar)
      - "\U000F140B" # mdi:solar-power
      - "\U000F0079" # mdi:battery (footer fuel gauge indicator)
      - "\U000F007E" # mdi:battery-50 (footer fuel gauge indicator)
      - "\U000F007B" # mdi:battery-20 (footer fuel gauge indicator)
      - "\U000F10CD" # mdi:battery-alert-variant-outline (footer fuel gauge indicator)

  # Material Design Icons - bus direction arrows, sized to match the
  # bus bubbles' font_bubble_value route-code text (see the width math
  # in the BUS DEPARTURE BUBBLES comment). Split out from
  # font_icons_medium (size 32) since these bubbles grew tall enough to
  # size their icons up independently, without affecting the grid/solar/
  # wifi/battery icons that still share font_icons_medium.
  - file: 'https://github.com/Templarian/MaterialDesign-Webfont/raw/master/fonts/materialdesignicons-webfont.ttf'
    id: font_icons_bus
    size: 40
    glyphs:
      - "\U000F004D" # mdi:arrow-left
      - "\U000F0054" # mdi:arrow-right
      - "\U000F17A1" # mdi:arrow-down-left

# Binary sensors for Home Assistant data
binary_sensor:
  # Taku Sleep Mode - triggers deep sleep when on
  - platform: homeassistant
    id: taku_sleep_mode
    entity_id: binary_sensor.taku_sleep_mode
    on_state:
      then:
        - if:
            condition:
              binary_sensor.is_on: taku_sleep_mode
            then:
              - logger.log: "Taku Sleep Mode activated - entering deep sleep"
              - delay: 2s  # Allow log message to be sent
              - deep_sleep.enter: deep_sleep_control

  # Downstairs heating demand (any downstairs TRV calling for heat) -
  # colors the HOME bubble's Heat row red when active.
  - platform: homeassistant
    id: downstairs_heating_demand
    entity_id: binary_sensor.downstairs_heating_demand

  # Hot water tank actively heating - defined as the tank temperature
  # trending upward over the last 10 minutes (binary_sensor/hot_water_heating.yaml,
  # a trend sensor), regardless of what's actually heating it. Colors the
  # HOME bubble's Water row red when active.
  - platform: homeassistant
    id: hot_water_heating
    entity_id: binary_sensor.hot_water_heating

# Text sensors for Home Assistant data
text_sensor:
  # Weather condition
  - platform: homeassistant
    id: weather_condition
    entity_id: weather.home

  # Alarm state for refresh suppression
  - platform: homeassistant
    id: alarm_state
    entity_id: alarm_control_panel.hkc_alarm_system

  # Zone home person count (0 = nobody home)
  - platform: homeassistant
    id: zone_home_persons
    entity_id: zone.home
    attribute: persons

  # Next bus departures (Transit app sensors). Icons indicate rough
  # direction of travel from the house: arrow-left for Fairyhill/E1
  # (towards Ballywaltrim), arrow-right for the two Killarney Road
  # services, arrow-bottom-left for the Oldcourt 45A.
  - platform: homeassistant
    id: bus_fairyhill_e1_ballywaltrim
    entity_id: sensor.transit_app_fairyhill_e1_to_ballywaltrim

  - platform: homeassistant
    id: bus_killarney_road_e1_northwood
    entity_id: sensor.transit_app_killarney_road_e1_to_northwood

  - platform: homeassistant
    id: bus_killarney_road_l12_bray_station
    entity_id: sensor.transit_app_killarney_road_l12_to_bray_station

  - platform: homeassistant
    id: bus_oldcourt_45a_dun_laoghaire
    entity_id: sensor.transit_app_oldcourt_45a_to_dun_laoghaire

  # HKC alarm door/window contact sensors - state is text, "Open" or
  # "Closed" (IR/motion zones are deliberately excluded, only door and
  # window contacts are tracked here).
  - platform: homeassistant
    id: door_back
    entity_id: sensor.back_door

  - platform: homeassistant
    id: door_front
    entity_id: sensor.front_door

  - platform: homeassistant
    id: door_front_room
    entity_id: sensor.front_room

  - platform: homeassistant
    id: door_garage
    entity_id: sensor.garagedoor

  - platform: homeassistant
    id: door_kitchen_win
    entity_id: sensor.kitchen_win

  - platform: homeassistant
    id: door_roller
    entity_id: sensor.rollerdoor

  - platform: homeassistant
    id: door_shack
    entity_id: sensor.shack_door

  - platform: homeassistant
    id: door_sitting_room
    entity_id: sensor.sitting_roo

  - platform: homeassistant
    id: door_up_wins
    entity_id: sensor.up_wins

# Sensors for Home Assistant data
sensor:
  # Weather data
  - platform: homeassistant
    id: weather_temperature
    entity_id: weather.home
    attribute: temperature

  # Outside temperature (OpenWeatherMap)
  - platform: homeassistant
    id: outside_temperature
    entity_id: sensor.openweathermap_temperature

  # Air Quality Index (WAQI integration, Bray station)
  - platform: homeassistant
    id: air_quality_index
    entity_id: sensor.bray_ireland_air_quality_index

  # Indoor temperatures - key rooms
  - platform: homeassistant
    id: hall_temperature
    entity_id: sensor.hall_sensor_temperature

  - platform: homeassistant
    id: sitting_room_temperature
    entity_id: sensor.sitting_room_sensor_temperature

  - platform: homeassistant
    id: kitchen_temperature
    entity_id: sensor.kitchen_sensor_temperature

  - platform: homeassistant
    id: family_room_temperature
    entity_id: sensor.family_room_sensor_temperature

  # Hall thermostat target
  - platform: homeassistant
    id: thermostat_target
    entity_id: sensor.hall_thermostat_target_temperature

  - platform: homeassistant
    id: thermostat_current
    entity_id: sensor.hall_thermostat_current_temperature

  # Utilities - Grid and Solar (both daily kWh, standardised units)
  - platform: homeassistant
    id: daily_grid_energy
    entity_id: sensor.downstairs_display_daily_grid_energy

  - platform: homeassistant
    id: solar_today
    entity_id: sensor.solis_energy_today

  # Hot water cylinder temperature
  - platform: homeassistant
    id: hot_water_temperature
    entity_id: sensor.hot_water_tank_temperature

  # Toshl - Revolut current account balances
  - platform: homeassistant
    id: genevieve_account_balance
    entity_id: sensor.genevieve_current_account_balance

  - platform: homeassistant
    id: reuben_account_balance
    entity_id: sensor.reuben_current_account_balance

  # WiFi Signal Sensor
  - platform: wifi_signal
    id: wifi_signal_strength
    name: "${friendly_name} WiFi Signal"
    update_interval: 60s

  # MAX17043 LiPo fuel gauge - 18650 cell battery backup
  - platform: max17043
    update_interval: 60s
    battery_voltage:
      name: "${friendly_name} Battery Voltage"
      id: fuel_gauge_voltage
    battery_level:
      name: "${friendly_name} Battery Level"
      id: fuel_gauge_level

# E-Ink Display
display:
  - platform: waveshare_epaper
    id: eink_display
    cs_pin: ${pin_cs}
    dc_pin: ${pin_dc}
    busy_pin:
      number: ${pin_busy}
      inverted: true  # REQUIRED for 7.30in-f to prevent display damage!
    reset_pin: ${pin_reset}
    model: ${waveshare_model}
    update_interval: never
    rotation: 0°
    
    lambda: |-
      // ===========================================
      // TRMNL-INSPIRED INFO DASHBOARD
      // Waveshare 7.3" e-Paper HAT (G) 4-Color (800x480)
      // Layout: Header | Home Temps + Utilities/Electricity + Weather
      // ===========================================

      // Display dimensions
      const int SCREEN_WIDTH = 800;
      const int SCREEN_HEIGHT = 480;
      const int MARGIN = 12;
      const int SECTION_GAP = 12;

      // Clear display with white background
      it.fill(id(color_white));

      // Get current time
      auto time = id(homeassistant_time).now();

      if (!time.is_valid()) {
        it.printf(SCREEN_WIDTH/2, SCREEN_HEIGHT/2, id(font_header), id(color_black), TextAlign::CENTER,
                  "Waiting for Home Assistant...");
        return;
      }

      // ===== HEADER SECTION: 3 info bubbles (Time / Date / Weather) =====
      // Bordered boxes rather than one solid bar, TRMNL/bubble-UI style -
      // distinct at a glance, more compact than the old full-width clock.

      // Weather icon mapping - computed once here (used by the header
      // weather bubble below, and reused as-is by the WEATHER column
      // further down).
      std::string weather_icon = "\U000F0599"; // default: sunny
      if (id(weather_condition).has_state()) {
        std::string condition = id(weather_condition).state;
        if (condition == "cloudy") weather_icon = "\U000F0590";
        else if (condition == "fog") weather_icon = "\U000F0591";
        else if (condition == "hail") weather_icon = "\U000F0592";
        else if (condition == "lightning") weather_icon = "\U000F0593";
        else if (condition == "lightning-rainy") weather_icon = "\U000F067E";
        else if (condition == "clear-night") weather_icon = "\U000F0594";
        else if (condition == "partlycloudy") weather_icon = "\U000F0595";
        else if (condition == "pouring") weather_icon = "\U000F0596";
        else if (condition == "rainy") weather_icon = "\U000F0597";
        else if (condition == "snowy") weather_icon = "\U000F0598";
        else if (condition == "snowy-rainy") weather_icon = "\U000F067F";
        else if (condition == "sunny") weather_icon = "\U000F0599";
        else if (condition == "windy") weather_icon = "\U000F059D";
        else if (condition == "windy-variant") weather_icon = "\U000F059E";
      }

      // Open doors/windows - HKC alarm contact sensors (text state,
      // "Open" or "Closed"). IR/motion zones are deliberately not part
      // of this list. Drawn below the bus departures (center column),
      // computed here since it doesn't depend on that column's layout.
      const char* open_labels[9] = {"Back", "Front", "F.Room", "Garage", "Kitchen", "Roller", "Shack", "Sitting", "Up Win"};
      bool open_state[9] = {
        id(door_back).has_state() && id(door_back).state == "Open",
        id(door_front).has_state() && id(door_front).state == "Open",
        id(door_front_room).has_state() && id(door_front_room).state == "Open",
        id(door_garage).has_state() && id(door_garage).state == "Open",
        id(door_kitchen_win).has_state() && id(door_kitchen_win).state == "Open",
        id(door_roller).has_state() && id(door_roller).state == "Open",
        id(door_shack).has_state() && id(door_shack).state == "Open",
        id(door_sitting_room).has_state() && id(door_sitting_room).state == "Open",
        id(door_up_wins).has_state() && id(door_up_wins).state == "Open",
      };
      int open_count = 0;
      std::string open_names = "";
      const int OPEN_NAMES_SHOWN = 5;  // center column is wide enough for several names before truncating
      for (int i = 0; i < 9; i++) {
        if (open_state[i]) {
          if (open_count < OPEN_NAMES_SHOWN) {
            if (!open_names.empty()) open_names += ", ";
            open_names += open_labels[i];
          }
          open_count++;
        }
      }
      if (open_count > OPEN_NAMES_SHOWN) {
        char more_buf[16];
        snprintf(more_buf, sizeof(more_buf), " +%d", open_count - OPEN_NAMES_SHOWN);
        open_names += more_buf;
      }

      // 3 bubbles now (was 4) - Month and Date merged into one, freeing a
      // bubble-width of space for Weather to expand into on its left side.
      // Fonts here are bold and larger than the rest of the display -
      // readability from ~2.5m away was the point of this bubble row.
      const int BUBBLE_TOP = 6;
      const int BUBBLE_HEIGHT = 135;  // tall enough for the Date bubble's calendar-page styling (month/big day/weekday)
      const int BUBBLE_GAP = 10;
      int bubble_w = (SCREEN_WIDTH - 2 * MARGIN - BUBBLE_GAP * 3) / 4;  // Time/Date keep the original single-bubble width

      int bubble1_x = MARGIN;
      int bubble2_x = bubble1_x + bubble_w + BUBBLE_GAP;
      int bubble3_x = bubble2_x + bubble_w + BUBBLE_GAP;
      int bubble3_w = SCREEN_WIDTH - MARGIN - bubble3_x;  // Weather absorbs everything left over

      // Bubble 1: Time - font bumped to the largest size that still fits
      // the fixed bubble width without clipping (see font_time).
      it.rectangle(bubble1_x, BUBBLE_TOP, bubble_w, BUBBLE_HEIGHT, id(color_black));
      it.printf(bubble1_x + 8, BUBBLE_TOP + 6, id(font_bubble_label), id(color_red), TextAlign::TOP_LEFT, "TIME");
      it.printf(bubble1_x + 8, BUBBLE_TOP + 52, id(font_time), id(color_black), TextAlign::TOP_LEFT,
                "%02d:%02d", time.hour, time.minute);

      // Bubble 2: Date, styled like a tear-off desk calendar page - small
      // month header, a huge day-of-month number dominating the bubble,
      // small weekday footer, with a dashed "perforation" line either
      // side of the big number standing in for the page-tear edges.
      int bubble2_center_x = bubble2_x + bubble_w / 2;
      it.rectangle(bubble2_x, BUBBLE_TOP, bubble_w, BUBBLE_HEIGHT, id(color_black));
      it.strftime(bubble2_center_x, BUBBLE_TOP + 4, id(font_bubble_label), id(color_red), TextAlign::TOP_CENTER, "%b", time);

      int date_perf1_y = BUBBLE_TOP + 24;
      for (int dx = bubble2_x + 6; dx < bubble2_x + bubble_w - 6; dx += 8) {
        it.line(dx, date_perf1_y, dx + 4, date_perf1_y, id(color_red));
      }

      it.strftime(bubble2_center_x, BUBBLE_TOP + 28, id(font_calendar_day), id(color_black), TextAlign::TOP_CENTER, "%d", time);

      int date_perf2_y = BUBBLE_TOP + 100;
      for (int dx = bubble2_x + 6; dx < bubble2_x + bubble_w - 6; dx += 8) {
        it.line(dx, date_perf2_y, dx + 4, date_perf2_y, id(color_red));
      }

      it.strftime(bubble2_center_x, BUBBLE_TOP + 104, id(font_small), id(color_black), TextAlign::TOP_CENTER, "%A", time);

      // Bubble 3: Weather - condensed to one line (icon + temperature,
      // icon + AQI) per feedback that the previous icon/temp/condition/
      // feels-like/humidity stack was too much to read at a glance;
      // condition text and feels-like/humidity are dropped rather than
      // relocated. AQI icon shares font_icons_weather so it matches the
      // weather icon's size; AQI number colored by rough severity band
      // (this panel only has 4 inks, so there are only two thresholds:
      // >100 red, >50 yellow, otherwise black).
      it.rectangle(bubble3_x, BUBBLE_TOP, bubble3_w, BUBBLE_HEIGHT, id(color_black));
      it.printf(bubble3_x + 8, BUBBLE_TOP + 6, id(font_bubble_label), id(color_red), TextAlign::TOP_LEFT, "WEATHER");

      int weather_row_y = BUBBLE_TOP + 55;
      it.printf(bubble3_x + 8, weather_row_y, id(font_icons_weather), id(color_black), TextAlign::TOP_LEFT,
                "%s", weather_icon.c_str());
      if (id(outside_temperature).has_state()) {
        it.printf(bubble3_x + 72, weather_row_y + 4, id(font_temp_large), id(color_black), TextAlign::TOP_LEFT,
                  "%.0f°C", id(outside_temperature).state);
      } else {
        it.printf(bubble3_x + 72, weather_row_y + 4, id(font_temp_large), id(color_black), TextAlign::TOP_LEFT, "--°C");
      }

      int aqi_icon_x = bubble3_x + bubble3_w / 2 + 36;
      it.printf(aqi_icon_x, weather_row_y, id(font_icons_weather), id(color_black), TextAlign::TOP_LEFT, "\U000F0D43");
      if (id(air_quality_index).has_state()) {
        float aqi = id(air_quality_index).state;
        Color aqi_color = aqi > 100 ? id(color_red) : (aqi > 50 ? id(color_yellow) : id(color_black));
        it.printf(bubble3_x + bubble3_w - 8, weather_row_y + 4, id(font_temp_large), aqi_color, TextAlign::TOP_RIGHT,
                  "%.0f", aqi);
      } else {
        it.printf(bubble3_x + bubble3_w - 8, weather_row_y + 4, id(font_temp_large), id(color_black), TextAlign::TOP_RIGHT, "--");
      }

      // ===== LEFT COLUMN (Home Sensors) =====
      int left_col_x = MARGIN;
      int left_col_width = 130;
      int content_y = BUBBLE_TOP + BUBBLE_HEIGHT + 12;

      // ===== HOME bubble =====
      // Bordered like every other section on this display - this one was
      // still a bare label + underline, the one holdout once the rest
      // moved to the bordered "bubble" style.
      const int REVOLUT_BUBBLE_HEIGHT = 86;
      int revolut_bubble_y = (SCREEN_HEIGHT - 35) - 10 - REVOLUT_BUBBLE_HEIGHT;
      int home_bubble_h = revolut_bubble_y - content_y - 6;
      it.rectangle(left_col_x, content_y, left_col_width, home_bubble_h, id(color_black));
      it.printf(left_col_x + 8, content_y + 8, id(font_bubble_label), id(color_red), TextAlign::TOP_LEFT, "HOME");

      int home_y = content_y + 34;
      int row_height = 26;

      // Heating status (current -> target) - red while any downstairs TRV
      // is actively calling for heat (binary_sensor.downstairs_heating_demand).
      if (id(thermostat_current).has_state() && id(thermostat_target).has_state()) {
        Color heat_color = (id(downstairs_heating_demand).has_state() && id(downstairs_heating_demand).state) ? id(color_red) : id(color_black);
        it.printf(left_col_x + 8, home_y, id(font_small), heat_color, TextAlign::TOP_LEFT, "Heat");
        it.printf(left_col_x + left_col_width - 8, home_y, id(font_small), heat_color, TextAlign::TOP_RIGHT,
                  "%.0f→%.0f°", id(thermostat_current).state, id(thermostat_target).state);
      }
      home_y += row_height + 4;

      // Hall
      if (id(hall_temperature).has_state()) {
        it.printf(left_col_x + 8, home_y, id(font_small), id(color_black), TextAlign::TOP_LEFT, "Hall");
        it.printf(left_col_x + left_col_width - 8, home_y, id(font_small), id(color_black), TextAlign::TOP_RIGHT,
                  "%.1f°", id(hall_temperature).state);
      }
      home_y += row_height;

      // Sitting Room
      if (id(sitting_room_temperature).has_state()) {
        it.printf(left_col_x + 8, home_y, id(font_small), id(color_black), TextAlign::TOP_LEFT, "Sitting");
        it.printf(left_col_x + left_col_width - 8, home_y, id(font_small), id(color_black), TextAlign::TOP_RIGHT,
                  "%.1f°", id(sitting_room_temperature).state);
      }
      home_y += row_height;

      // Kitchen
      if (id(kitchen_temperature).has_state()) {
        it.printf(left_col_x + 8, home_y, id(font_small), id(color_black), TextAlign::TOP_LEFT, "Kitchen");
        it.printf(left_col_x + left_col_width - 8, home_y, id(font_small), id(color_black), TextAlign::TOP_RIGHT,
                  "%.1f°", id(kitchen_temperature).state);
      }
      home_y += row_height;

      // Family Room
      if (id(family_room_temperature).has_state()) {
        it.printf(left_col_x + 8, home_y, id(font_small), id(color_black), TextAlign::TOP_LEFT, "Family");
        it.printf(left_col_x + left_col_width - 8, home_y, id(font_small), id(color_black), TextAlign::TOP_RIGHT,
                  "%.1f°", id(family_room_temperature).state);
      }
      home_y += row_height;

      // Hot Water (bottom item in this list) - red while the tank is
      // actively heating, defined as its temperature trending upward
      // over the last 10 minutes (binary_sensor.hot_water_heating, a
      // trend sensor - see binary_sensor/hot_water_heating.yaml) rather
      // than a fixed temperature threshold, so this tracks heating
      // regardless of what's doing the heating.
      if (id(hot_water_temperature).has_state()) {
        float hot_water_temp = id(hot_water_temperature).state;
        Color hot_water_color = (id(hot_water_heating).has_state() && id(hot_water_heating).state) ? id(color_red) : id(color_black);
        it.printf(left_col_x + 8, home_y, id(font_small), hot_water_color, TextAlign::TOP_LEFT, "Water");
        it.printf(left_col_x + left_col_width - 8, home_y, id(font_small), hot_water_color, TextAlign::TOP_RIGHT,
                  "%.1f°", hot_water_temp);
      }

      // ===== REVOLUT BALANCES bubble (bottom-left corner, pinned above the footer) =====
      // revolut_bubble_y/REVOLUT_BUBBLE_HEIGHT are declared up in the HOME
      // bubble above, which needs them to size itself to fit exactly
      // above this one.
      it.rectangle(left_col_x, revolut_bubble_y, left_col_width, REVOLUT_BUBBLE_HEIGHT, id(color_black));
      it.printf(left_col_x + 8, revolut_bubble_y + 8, id(font_bubble_label), id(color_red), TextAlign::TOP_LEFT, "REVOLUT");

      int revolut_row_h = 22;
      int revolut_y = revolut_bubble_y + 34;

      // Genevieve Account Balance
      it.printf(left_col_x + 8, revolut_y, id(font_small), id(color_black), TextAlign::TOP_LEFT, "Gen");
      if (id(genevieve_account_balance).has_state()) {
        it.printf(left_col_x + left_col_width - 8, revolut_y, id(font_currency), id(color_black), TextAlign::TOP_RIGHT,
                  "€%.2f", id(genevieve_account_balance).state);
      } else {
        it.printf(left_col_x + left_col_width - 8, revolut_y, id(font_currency), id(color_black), TextAlign::TOP_RIGHT, "--");
      }

      revolut_y += revolut_row_h;

      // Reuben Account Balance
      it.printf(left_col_x + 8, revolut_y, id(font_small), id(color_black), TextAlign::TOP_LEFT, "Reu");
      if (id(reuben_account_balance).has_state()) {
        it.printf(left_col_x + left_col_width - 8, revolut_y, id(font_currency), id(color_black), TextAlign::TOP_RIGHT,
                  "€%.2f", id(reuben_account_balance).state);
      } else {
        it.printf(left_col_x + left_col_width - 8, revolut_y, id(font_currency), id(color_black), TextAlign::TOP_RIGHT, "--");
      }

      // ===== CENTER COLUMN (Utilities) =====
      int center_col_x = left_col_x + left_col_width + SECTION_GAP;
      // Fills the rest of the row - the WEATHER column was removed (its
      // content moved into the header weather bubble), so this now absorbs
      // that freed width instead of a fixed ~2/3 split.
      int center_col_width = SCREEN_WIDTH - 2 * MARGIN - left_col_width - SECTION_GAP;

      // ===== UTILITIES + OPEN DOORS/WINDOWS bubbles, side by side =====
      // Bordered like the header row bubbles - a plain header + underline
      // here was hard to read from across the room. UTILITIES only ever
      // has 2 short rows, so a full-width bubble for it alone wasted a
      // lot of vertical space; pairing it with OPEN DOORS/WINDOWS (which
      // needs even less) in the same row height uses that space instead
      // of stacking them as two separate full-width bubbles.
      const int UTIL_BUBBLE_HEIGHT = 106;
      const int TOP_ROW_GAP = 10;
      int top_row_bubble_w = (center_col_width - TOP_ROW_GAP) / 2;
      int open_bubble_x = center_col_x + top_row_bubble_w + TOP_ROW_GAP;

      it.rectangle(center_col_x, content_y, top_row_bubble_w, UTIL_BUBBLE_HEIGHT, id(color_black));
      it.printf(center_col_x + 8, content_y + 8, id(font_bubble_label), id(color_red), TextAlign::TOP_LEFT, "UTILITIES");

      int util_y = content_y + 34;
      int util_row = 38;

      // Grid Energy Today (daily kWh, matching Solar Today's units)
      it.printf(center_col_x + 8, util_y, id(font_icons_medium), id(color_black), TextAlign::TOP_LEFT, "\U000F0A72");
      it.printf(center_col_x + 48, util_y + 4, id(font_body), id(color_black), TextAlign::TOP_LEFT, "Grid Today");
      if (id(daily_grid_energy).has_state()) {
        it.printf(center_col_x + top_row_bubble_w - 8, util_y + 4, id(font_body), id(color_black), TextAlign::TOP_RIGHT,
                  "%.1f kWh", id(daily_grid_energy).state);
      } else {
        it.printf(center_col_x + top_row_bubble_w - 8, util_y + 4, id(font_body), id(color_black), TextAlign::TOP_RIGHT, "-- kWh");
      }

      util_y += util_row;

      // Solar Yield Today
      it.printf(center_col_x + 8, util_y, id(font_icons_medium), id(color_yellow), TextAlign::TOP_LEFT, "\U000F05A8");
      it.printf(center_col_x + 48, util_y + 4, id(font_body), id(color_black), TextAlign::TOP_LEFT, "Solar Today");
      if (id(solar_today).has_state()) {
        it.printf(center_col_x + top_row_bubble_w - 8, util_y + 4, id(font_body), id(color_black), TextAlign::TOP_RIGHT,
                  "%.1f kWh", id(solar_today).state);
      } else {
        it.printf(center_col_x + top_row_bubble_w - 8, util_y + 4, id(font_body), id(color_black), TextAlign::TOP_RIGHT, "-- kWh");
      }

      // OPEN DOORS/WINDOWS - was its own full-width bubble below the bus
      // row; moved up alongside UTILITIES since its content (a label plus
      // one line) never needed a whole row's height to itself.
      it.rectangle(open_bubble_x, content_y, top_row_bubble_w, UTIL_BUBBLE_HEIGHT, id(color_black));
      it.printf(open_bubble_x + 8, content_y + 8, id(font_bubble_label), id(color_red), TextAlign::TOP_LEFT, "OPEN DOORS/WINDOWS");
      if (open_count == 0) {
        it.printf(open_bubble_x + 8, content_y + 34, id(font_body), id(color_black), TextAlign::TOP_LEFT, "All closed");
      } else {
        it.printf(open_bubble_x + 8, content_y + 34, id(font_body), id(color_red), TextAlign::TOP_LEFT, "%s", open_names.c_str());
      }

      // ===== BUS DEPARTURE BUBBLES =====
      // Bordered like the header row bubbles - a plain text list here was
      // hard to read from across the room. Four equal bubbles: 45A,
      // Fairyhill E1 (towards Ballywaltrim), and the two Killarney Road
      // services (E1 towards Northwood, L12 towards Bray Station) - the
      // Killarney pair started out sharing one double-wide bubble, but
      // that read as clunky in practice, so each route gets its own. The
      // direction arrow is always visible in its bubble, so a stop name
      // isn't needed alongside it.
      //
      // Sensor state is an ISO8601 UTC timestamp, e.g.
      // "2026-09-01T15:08:28+00:00" (the "+00:00" is genuine - Transit
      // app reports these in UTC, not local time; only the first 19
      // characters are parsed since the offset is always +00:00). An
      // earlier version of this code treated the digits as already-local
      // and skipped the UTC conversion, which put every displayed
      // departure about an hour in the past (Ireland is UTC+1 for most
      // of the year) and permanently clamped "in N min" to 0 - confirmed
      // from a physical-display photo where "(15:43)" etc. only make
      // sense as UTC 16:43 local, a few minutes after the 16:30 shown as
      // the current time, not literally 15:43. Fixed by parsing as UTC
      // (recalc_timestamp_utc - unambiguous, no DST involved) and
      // converting to local only for display (from_epoch_local, which
      // resolves DST correctly because it's applied to a definite
      // instant rather than to bare wall-clock digits).
      auto format_bus = [&](bool has_state, const std::string &raw) -> std::pair<std::string, std::string> {
        char line1[16];
        char line2[16];
        line2[0] = '\0';
        if (!has_state || raw.size() < 19) {
          snprintf(line1, sizeof(line1), "--");
          return {std::string(line1), std::string(line2)};
        }
        std::string clean = raw.substr(0, 19);
        clean[10] = ' ';  // "YYYY-MM-DDTHH:MM:SS" -> "YYYY-MM-DD HH:MM:SS" for strptime
        ESPTime dep{};
        if (!ESPTime::strptime(clean.c_str(), clean.size(), dep)) {
          snprintf(line1, sizeof(line1), "--");
          return {std::string(line1), std::string(line2)};
        }
        dep.recalc_timestamp_utc(false);

        int mins = (int) ((dep.timestamp - id(homeassistant_time).now().timestamp) / 60);
        if (mins < 0) mins = 0;
        ESPTime local_dep = ESPTime::from_epoch_local(dep.timestamp);
        snprintf(line1, sizeof(line1), "in %d min", mins);
        snprintf(line2, sizeof(line2), "(%02d:%02d)", local_dep.hour, local_dep.minute);
        return {std::string(line1), std::string(line2)};
      };

      // Single-route bubble: icon top-left, route code big and bold
      // top-right (mirrors the header bubbles' icon+value layout, both
      // now sized up via font_icons_bus/font_bubble_value - see the size
      // math below), then "in N min" / "(HH:MM)" stacked below with the
      // extra breathing room the taller bubble (below) now has, once
      // UTILITIES/OPEN DOORS/WINDOWS stopped needing this row's full
      // height.
      auto draw_bus_bubble = [&](int bx, int by, int bw, int bh, const char *icon, bool has_state, const std::string &raw, const char *route) {
        it.rectangle(bx, by, bw, bh, id(color_black));
        it.printf(bx + 10, by + 10, id(font_icons_bus), id(color_black), TextAlign::TOP_LEFT, "%s", icon);
        it.printf(bx + bw - 10, by + 8, id(font_bubble_value), id(color_black), TextAlign::TOP_RIGHT, "%s", route);
        auto eta = format_bus(has_state, raw);
        it.printf(bx + 10, by + 72, id(font_bubble_label), id(color_black), TextAlign::TOP_LEFT, "%s", eta.first.c_str());
        if (!eta.second.empty()) {
          it.printf(bx + 10, by + 100, id(font_small), id(color_black), TextAlign::TOP_LEFT, "%s", eta.second.c_str());
        }
      };

      const int BUS_BUBBLE_GAP = 10;
      // 4 equal-width bubbles across the row.
      int bus_bubble_w = (center_col_width - 3 * BUS_BUBBLE_GAP) / 4;

      int bus_bubble_y = content_y + UTIL_BUBBLE_HEIGHT + 14;
      // Grows to fill the vertical space UTILITIES/OPEN DOORS/WINDOWS
      // freed up by sharing one row instead of stacking full-width -
      // route code/icon sizes above (font_bubble_value 40, font_icons_bus
      // 40) were picked to roughly fit this bubble's ~151px width with
      // ~10-20px clearance between the two (icon left, route code
      // right): icon_size + 1.8*route_size <~ bubble_w - 2*padding.
      const int BUS_BUBBLE_HEIGHT = (SCREEN_HEIGHT - 35) - bus_bubble_y - 10;
      int bus_45a_x = center_col_x;
      int bus_fairyhill_x = bus_45a_x + bus_bubble_w + BUS_BUBBLE_GAP;
      int bus_killarney_e1_x = bus_fairyhill_x + bus_bubble_w + BUS_BUBBLE_GAP;
      int bus_killarney_l12_x = bus_killarney_e1_x + bus_bubble_w + BUS_BUBBLE_GAP;

      draw_bus_bubble(bus_45a_x, bus_bubble_y, bus_bubble_w, BUS_BUBBLE_HEIGHT, "\U000F17A1",
                       id(bus_oldcourt_45a_dun_laoghaire).has_state(), id(bus_oldcourt_45a_dun_laoghaire).state, "45A");

      draw_bus_bubble(bus_fairyhill_x, bus_bubble_y, bus_bubble_w, BUS_BUBBLE_HEIGHT, "\U000F004D",
                       id(bus_fairyhill_e1_ballywaltrim).has_state(), id(bus_fairyhill_e1_ballywaltrim).state, "E1");

      draw_bus_bubble(bus_killarney_e1_x, bus_bubble_y, bus_bubble_w, BUS_BUBBLE_HEIGHT, "\U000F0054",
                       id(bus_killarney_road_e1_northwood).has_state(), id(bus_killarney_road_e1_northwood).state, "E1");

      draw_bus_bubble(bus_killarney_l12_x, bus_bubble_y, bus_bubble_w, BUS_BUBBLE_HEIGHT, "\U000F0054",
                       id(bus_killarney_road_l12_bray_station).has_state(), id(bus_killarney_road_l12_bray_station).state, "L12");

      // ===== FOOTER =====
      int footer_y = SCREEN_HEIGHT - 35;
      it.line(MARGIN, footer_y, SCREEN_WIDTH - MARGIN, footer_y, id(color_black));

      // Last updated time
      it.strftime(MARGIN, footer_y + 8, id(font_small), id(color_black), TextAlign::TOP_LEFT,
                  "Updated %H:%M", time);

      // WiFi signal indicator
      if (id(wifi_signal_strength).has_state()) {
        float rssi = id(wifi_signal_strength).state;
        std::string wifi_icon = "\U000F091F"; // weak
        if (rssi > -50) wifi_icon = "\U000F0922"; // strong
        else if (rssi > -70) wifi_icon = "\U000F05CE"; // medium
        it.printf(SCREEN_WIDTH - MARGIN, footer_y + 5, id(font_icons_medium), id(color_black), TextAlign::TOP_RIGHT,
                  "%s", wifi_icon.c_str());
      }

      // Battery fuel gauge indicator - MAX17043 on the 18650 backup pack.
      // Placed left of the WiFi icon with a fixed gap, since the
      // percentage text's width varies.
      if (id(fuel_gauge_level).has_state()) {
        float level = id(fuel_gauge_level).state;
        std::string battery_icon = "\U000F10CD"; // low/alert
        if (level >= 60) battery_icon = "\U000F0079"; // full
        else if (level >= 30) battery_icon = "\U000F007E"; // 50%
        else if (level >= 15) battery_icon = "\U000F007B"; // 20%
        Color battery_color = level < 20 ? id(color_red) : id(color_black);
        int battery_x = SCREEN_WIDTH - MARGIN - 110;
        it.printf(battery_x, footer_y + 5, id(font_icons_medium), battery_color, TextAlign::TOP_LEFT,
                  "%s", battery_icon.c_str());
        it.printf(battery_x + 34, footer_y + 8, id(font_small), battery_color, TextAlign::TOP_LEFT,
                  "%.0f%%", level);
      }

# Deep Sleep Configuration
# Controlled by binary_sensor.taku_sleep_mode from Home Assistant
# When sleep mode is enabled, the device enters deep sleep until morning (07:00)
# when the automation disables sleep mode and the device wakes up
deep_sleep:
  id: deep_sleep_control
  # Sleep until woken by Home Assistant turning off sleep mode
  # The device will wake periodically to check if sleep mode is still on
  sleep_duration: ${sleep_duration}
  wakeup_pin:
    number: ${gpio_deep_sleep_wake_up}
  wakeup_pin_mode: KEEP_AWAKE

# Buttons to control display update
button:
  - platform: template
    name: "${friendly_name} Refresh Display"
    icon: "mdi:refresh"
    on_press:
      then:
        - logger.log: "Manual display refresh triggered"
        - component.update: eink_display

  - platform: template
    name: "${friendly_name} Deep Sleep"
    icon: "mdi:sleep"
    on_press:
      then:
        - logger.log: "Manual deep sleep triggered"
        - deep_sleep.enter: deep_sleep_control

  - platform: restart
    name: "${friendly_name} Restart"
