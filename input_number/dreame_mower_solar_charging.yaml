dreame_mower_solar_high_w:
  name: "Dreame Mower - Solar Charging Threshold (High)"
  # PV output that must be sustained for 15 minutes to allow charging any time
  min: 500
  max: 5000
  step: 100
  initial: 1500
  unit_of_measurement: "W"
  icon: mdi:solar-power
dreame_mower_solar_low_w:
  name: "Dreame Mower - Solar Charging Threshold (Low)"
  # PV output below which (for 15 minutes) charging reverts to the night window
  min: 0
  max: 2000
  step: 100
  initial: 500
  unit_of_measurement: "W"
  icon: mdi:solar-power-variant-outline
