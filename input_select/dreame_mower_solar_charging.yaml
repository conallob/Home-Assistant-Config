dreame_mower_charging_mode:
  name: "Dreame Mower - Charging Mode"
  # Mode last applied by the Solar-Aware Charging automation. "unknown" until
  # the first evaluation after helper creation; used to tell automation-made
  # changes apart from manual changes made in the Dreame app.
  options:
    - unknown
    - night
    - solar
  icon: mdi:battery-clock
