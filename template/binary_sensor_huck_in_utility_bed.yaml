binary_sensor:
  - name: "Huck in Utility Bed"
    unique_id: huck_in_utility_bed
    device_class: occupancy
    # The LD2410 has_target signal can flicker for a second or two even
    # when Huck is genuinely in/out of the bed - debounce both directions
    # rather than reacting to every raw flip, which is the "flakey" behavior
    # that prompted this sensor.
    delay_on:
      seconds: 3
    delay_off:
      seconds: 30
    state: >
      {{ is_state('binary_sensor.utility_bluetooth_proxy_presence', 'on') }}
    icon: >
      {% if is_state('binary_sensor.huck_in_utility_bed', 'on') %}
        mdi:dog-side
      {% else %}
        mdi:dog-side-off
      {% endif %}
