# Home Assistant configuration for Taku
# This configuration creates a REST sensor to download the tariff data
# and then creates template sensors for each price component

sensor:
  # Electric Ireland Smart Duel Fuel tariff rates
  - name: "Electric Ireland Smart Duel Fuel Day Rate"
    unit_of_measurement: "EUR/kWh"
    state: "{{ state_attr('sensor.ireland_electricity_tariffs', 'electric-ireland-smart-dual-fuel')['rates']['day'] }}"

  - name: "Electric Ireland Smart Duel Fuel Night Rate"
    unit_of_measurement: "EUR/kWh"
    state: "{{ state_attr('sensor.ireland_electricity_tariffs', 'electric-ireland-smart-dual-fuel')['rates']['night'] }}"

  - name: "Electric Ireland Smart Duel Fuel Peak Rate"
    unit_of_measurement: "EUR/kWh"
    state: "{{ state_attr('sensor.ireland_electricity_tariffs', 'electric-ireland-smart-dual-fuel')['rates']['peak'] }}"

  # Flat rate paid for exported microgeneration - not time-banded like
  # day/night/peak, so this can be used directly as the Energy Dashboard's
  # "Entity with current price" for energy exported to grid.
  - name: "Electric Ireland Smart Duel Fuel Microgeneration Rate"
    unique_id: electric_ireland_smart_duel_fuel_microgeneration_rate
    unit_of_measurement: "EUR/kWh"
    state_class: measurement
    state: "{{ state_attr('sensor.ireland_electricity_tariffs', 'electric-ireland-smart-dual-fuel')['rates']['microgeneration'] }}"

  # Current active tariff rate, tracking the active tariff band as selected by
  # the "Rotate Electricity Meter Counter" automation on the
  # current_electricity_tariff utility_meter helper (configuration.yaml).
  # Used by the Energy Dashboard's "Use an entity with current price" cost setting.
  - name: "Current Electricity Rate"
    unique_id: current_electricity_rate
    unit_of_measurement: "EUR/kWh"
    state_class: measurement
    state: >
      {% set period = states('select.current_electricity_tariff') %}
      {% set tariff_data = state_attr('sensor.ireland_electricity_tariffs', 'electric-ireland-smart-dual-fuel') %}
      {% if tariff_data and period in ['day', 'night', 'peak'] %}
        {{ tariff_data['rates'][period] }}
      {% else %}
        unavailable
      {% endif %}
